<script>
/* HellKid: Hook & Jump — web reimplementation of the original iPhone OS 3 game (v1.7.1).
   Gameplay logic is a line-by-line port of the original binary's HellKidRender / MapManager /
   MapLayer / MapBlockRender / ItemRender / layer classes (reverse-engineered from the armv7 slice).
   World coordinates are the original OpenGL ones: 480x320, origin bottom-left, y up. */
'use strict';
const W = 480, H = 320;
const HK = window.HK = { OX: 0, VW: 480 };   // v2.1: OX = extra logical width shown on each side (wide screens)
let ctx, DATA;
const TEX = {}, UIIMG = {};

// ---------------------------------------------------------------- random (C rand())
const rand = () => (Math.random() * 2147483647) | 0;

// ---------------------------------------------------------------- drawing helpers
function drawFrame(t, frame, cx, cy, w, h, ang, alpha) {
  if (!t || frame <= 0) return;
  const rf = Math.max(1, Math.floor(t.w / t.fw)), i = frame - 1;
  const k = t.k || 1, sx = (i % rf) * t.fw * k, sy = Math.floor(i / rf) * t.fh * k;
  ctx.save();
  if (alpha !== undefined && alpha < 1) ctx.globalAlpha = Math.max(0, alpha);
  ctx.translate(cx, H - cy);
  if (ang) ctx.rotate(-ang * Math.PI / 180);
  ctx.drawImage(t.img, sx, sy, t.fw * k, t.fh * k, -w / 2, -h / 2, w, h);
  ctx.restore();
}
// draw a sub-rectangle (texture pixels) centered at world (cx,cy) with size w,h
function drawRegion(t, sx, sy, sw, sh, cx, cy, w, h, alpha) {
  if (!t || sw <= 0 || w <= 0) return;
  ctx.save();
  if (alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
  const k = t.k || 1; ctx.drawImage(t.img, sx * k, sy * k, sw * k, sh * k, cx - w / 2, H - cy - h / 2, w, h);
  ctx.restore();
}

// ---------------------------------------------------------------- SpriteRender / AnimationRender
class Anim {
  constructor(tex) {
    this.tex = typeof tex === 'string' ? TEX[tex] : tex;
    this.x = 0; this.y = 0; this.angle = 0;
    this.sx = this.tex ? this.tex.fw : 1; this.sy = this.tex ? this.tex.fh : 1;
    this.updatable = true; this.renderable = true; this.alpha = 1;
    this.mi = 0; this.fi = 0; this.t = 0; this.speed = 1;
    this.setMotion(0);
  }
  setTexture(tex) { this.tex = typeof tex === 'string' ? TEX[tex] : tex; this.sx = this.tex.fw; this.sy = this.tex.fh; this.setMotion(0); }
  setMotion(i) { this.mi = i; this.fi = 0; this.t = 0; this.updDraw(); }

function rrect(x, y, w, h, r) { const c = ctx(); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
const ThemePicker = {
  X: 14, Y: 270, PW: 74, PH: 26, GAP: 6,
  pill(i) { return [this.X - E() + 6 + i * (this.PW + this.GAP), this.Y + 18, this.PW, this.PH]; },
  render(t) {
    const c = ctx(), th = SAVE.theme || 'original', n = HK.THEMES.length;
    const w = 12 + n * this.PW + (n - 1) * this.GAP;
    c.save(); rrect(this.X - E(), this.Y, w, 50, 10); c.fillStyle = 'rgba(15,3,2,0.62)'; c.fill();

      c.save(); rrect(x, y, pw, ph, ph / 2);
      if (on) { const g = c.createLinearGradient(0, y, 0, y + ph); g.addColorStop(0, '#ffcf5a'); g.addColorStop(1, '#d9480f'); c.fillStyle = g; c.shadowColor = 'rgba(255,140,40,0.8)'; c.shadowBlur = 10 + Math.sin(t * 4) * 3; }
      else c.fillStyle = 'rgba(255,255,255,0.1)';
      c.fill(); c.shadowBlur = 0; c.strokeStyle = on ? '#fff3c4' : 'rgba(255,255,255,0.25)'; c.lineWidth = 1.2; c.stroke(); c.restore();
      text(label, x + pw / 2, y + ph / 2 + 1, 13, on ? '#3b0c00' : '#fff', 'center', on ? null : '#000', pw - 8);

  down(p) {

};

const oParts = FX.renderParts.bind(FX);

  }

<script>
/* Boot, asset loading, screen fitting, input and main loop (MainView). */
'use strict';
(function () {
const { W, H, TEX, UIIMG, AUDIO } = HK;
const canvas = document.getElementById('game');
const stage = document.getElementById('stage');
const c = canvas.getContext('2d');
HK.setCtx(c);
let RES = 2;                       // backing store, recomputed to match the real screen pixels (v2.0)
function setRes(r) { r = Math.max(1, Math.min(4, r)); const cw = Math.round(HK.VW * r); if (r === RES && canvas.width === cw) return; RES = r; canvas.width = cw; canvas.height = Math.round(H * RES); c.setTransform(RES, 0, 0, RES, 0, 0); c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high'; }
setRes(2);
const amb = document.getElementById('amb'), ambC = amb.getContext('2d');

// ---------------------------------------------------------------- fit 480x320 to the screen (rotate when portrait)
let rotated = false, scale = 1;
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
document.body.appendChild(probe);
function safeInsets() { const s = getComputedStyle(probe); return { t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0 }; }
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  rotated = vh > vw;
  const aw = rotated ? vh : vw, ah = rotated ? vw : vh;
  // v2.1: on wide screens (e.g. 19.5:9 iPhones) the world is widened instead of letterboxed.
  // The 480-wide core (HUD, menus) stays centred, which also keeps it clear of the notch.
  const VW = Math.round(Math.max(W, Math.min(720, H * aw / ah)));
  HK.VW = VW; HK.OX = (VW - W) / 2;
  scale = Math.min(aw / VW, ah / H);
  // safe-area (notch / Dynamic Island / rounded corners) in game units, on the sides of the game view
  const si = safeInsets(), side = rotated ? Math.max(si.t, si.b) : Math.max(si.l, si.r);
  const usedW = VW * scale, gap = ((rotated ? vh : vw) - usedW) / 2;
  HK.EDGE = Math.max(0, HK.OX - Math.max(0, side - gap) / scale - 6);
  stage.style.width = VW + 'px'; stage.style.height = H + 'px';
  canvas.style.width = VW + 'px'; canvas.style.height = H + 'px';
  const tx = (vw - VW * scale) / 2, ty = (vh - H * scale) / 2;
  if (!rotated) stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  else stage.style.transform = `translate(${(vw + H * scale) / 2}px, ${(vh - VW * scale) / 2}px) rotate(90deg) scale(${scale})`;
  RES = 0; setRes(Math.ceil(scale * (window.devicePixelRatio || 1) * 4) / 4);
}
HK.toggleFullscreen = () => {
  const d = document, el = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch?.(() => {});
  } catch (e) {}
};
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 200)); fit();

function toGame(e) {
  const vw = window.innerWidth, vh = window.innerHeight;
  let x, y;
  const VW = HK.VW;
  if (!rotated) { x = (e.clientX - (vw - VW * scale) / 2) / scale; y = (e.clientY - (vh - H * scale) / 2) / scale; }
  else { const ox = (vw + H * scale) / 2, oy = (vh - VW * scale) / 2; x = (e.clientY - oy) / scale; y = (ox - e.clientX) / scale; }
  return { x: x - HK.OX, y };
}

// ---------------------------------------------------------------- input (touch / mouse / keyboard)
const active = new Set();
function down(e) {
  e.preventDefault();
  HK.audioUnlock();
  if (!HK.ready) return;
  const pts = e.changedTouches ? Array.from(e.changedTouches) : [e];
  for (const t of pts) { const id = t.identifier !== undefined ? t.identifier : 'm'; active.add(id); dispatchDown(toGame(t)); }
}
function up(e) {
  e.preventDefault();
  if (!HK.ready) return;
  const pts = e.changedTouches ? Array.from(e.changedTouches) : [e];
  for (const t of pts) { const id = t.identifier !== undefined ? t.identifier : 'm'; active.delete(id); dispatchUp(toGame(t)); }
}
function dispatchDown(p) { const s = HK.Scene; if (s.id === 'logo') HK.Logo.down(p); else if (s.id === 'title') HK.Title.down(p); else if (s.id === 'lobby') HK.Lobby.down(p); else HK.gameDown(p); }
function dispatchUp(p) { const s = HK.Scene; if (s.id === 'title') HK.Title.up(p); else if (s.id === 'lobby') HK.Lobby.up(p); else HK.gameUp(p); }

document.addEventListener('touchstart', down, opt); document.addEventListener('touchend', up, opt); document.addEventListener('touchcancel', up, opt);

  if (keyHeld.has(e.code)) return; keyHeld.add(e.code); HK.audioUnlock();
  if (!HK.ready) return;
  const s = HK.Scene, v = s.view;
  if (ACTION_KEYS.has(e.code)) {
    e.preventDefault();
    if (s.id === 14 || HK.Tutorial.panel) { HK.gameDown({ x: 240, y: 200 }); return; }
  }
  const enter = e.code === 'Enter' || e.code === 'Space';
  if (s.id === 'logo' && enter) return HK.Logo.down({ x: 0, y: 0 });
  if (s.id === 'title' && enter && !HK.Title.optionsOpen()) { HK.play(4); return s.goLobby(); }
  if (s.id === 'lobby' && enter && !HK.Lobby.sub) { HK.play(4); return s.startMode(HK.SAVE.mode); }
  if (s.id === 'lobby' && e.code === 'Escape') { HK.Lobby.sub = null; HK.Lobby.menu = null; return s.goTitle(); }
  if (s.id === 14 && (e.code === 'Escape' || e.code === 'KeyP')) { s.pauses++; HK.play(4); return s.change(15); }
  if (s.id === 15 && (enter || e.code === 'Escape' || e.code === 'KeyP')) { HK.play(4); return s.change(16); }
  if (s.id === 15 && e.code === 'KeyR') { HK.paused = false; s.view = null; return s.change(13); }
  if (v === HK.GameOverView && (enter || e.code === 'KeyR')) return v.down({ x: 120, y: 270 });
  if (v === HK.GameOverView && e.code === 'Escape') return v.down({ x: 350, y: 270 });
  if (v === HK.OpeningView && enter) return v.down();
  if (v === HK.EndingView && enter) return v.down();

});
document.addEventListener('keyup', e => { keyHeld.delete(e.code); if (ACTION_KEYS.has(e.code) && HK.Scene.id === 14) HK.gameUp({ x: 240, y: 200 }); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (HK.Scene.id === 14 && !HK.Tutorial.panel) { HK.Scene.pauses = Math.max(0, HK.Scene.pauses); HK.Scene.change(15); } if (AUDIO.ctx) AUDIO.ctx.suspend(); }
  else if (AUDIO.ctx) AUDIO.ctx.resume();
});

// ---------------------------------------------------------------- loading
const bar = document.getElementById('loadbar');
function b64ToBuf(b64) { const s = atob(b64); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a.buffer; }
function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('img ' + src.slice(0, 60))); i.src = src; }); }
async function load() {
  const B = window.__HK_BUNDLE;
  const data = B ? B.data : await (await fetch('data.json')).json();
  HK.setData(data);
  const jobs = [];
  let done = 0, total = 0;
  const tick = () => { done++; if (bar) bar.style.width = (100 * done / total).toFixed(1) + '%'; };
  for (const n in data.tex) { total++; jobs.push(loadImage(B ? B.tex[n] : 'assets/tex/' + n + '.png').then(i => { TEX[n] = Object.assign({ img: i, orig: i, k: i.naturalWidth / data.tex[n].w }, data.tex[n]); tick(); })); }
  const uiNames = B ? Object.keys(B.ui) : data.ui;
  for (const n of uiNames) { total++; jobs.push(loadImage(B ? B.ui[n] : 'assets/ui/' + n).then(i => { const uk = (B && B.uiScale) || 1; i.lw = i.naturalWidth / uk; i.lh = i.naturalHeight / uk; UIIMG[n.replace(/\.(png|jpg|webp)$/, '')] = i; tick(); })); }

  for (const n of sndNames) { total++; jobs.push((B ? Promise.resolve(b64ToBuf(B.snd[n])) : fetch('assets/snd/' + n).then(r => r.arrayBuffer())).then(buf => { AUDIO.raw[n.replace(/\.(mp3|wav)$/, '')] = buf; tick(); })); }

const colorCache = {};
HK.texColor = name => {

  const x = cv.getContext('2d'); x.drawImage(t.img, t.w / 2 * (t.k || 1), t.h / 2 * (t.k || 1), 1, 1, 0, 0, 1, 1);

// ---------------------------------------------------------------- main loop (-[MainView mainLoop]: dt clamped to 1/30)
let prev = 0;

  if (dt > 0.0333) dt = 0.0333;

  if (inGame) { c.fillStyle = '#000'; c.fillRect(0, 0, HK.VW, H); }
  else { c.clearRect(0, 0, HK.VW, H); c.fillStyle = '#000'; c.fillRect(HK.OX, 0, W, H); }

  else if (s.id === 'title') { HK.Title.update(dt); HK.Title.render(); }
  else if (s.id === 'lobby') { HK.Lobby.update(dt); HK.Lobby.render(); }

let ambN = 0, ambOn = false;

const fontReady = (document.fonts && document.fonts.load) ? Promise.race([document.fonts.load('20px "Lilita One"'), new Promise(r => setTimeout(r, 2500))]).catch(() => {}) : Promise.resolve();
Promise.all([load(), fontReady]).then(() => {
  HK.Layers.crow.init(); HK.Layers.magma.init(); HK.Layers.far.init(); HK.Layers.map.init(); HK.Layers.character.init();
  if (HK.afterInit) HK.afterInit();
  HK.ready = true;
  document.getElementById('loading').style.display = 'none';
  HK.Scene.id = 'logo'; HK.Logo.t = 0;
  if (window.__HK_AUTOSTART) window.__HK_AUTOSTART();
  requestAnimationFrame(loop);
}).catch(err => { document.getElementById('loadtxt').textContent = 'Erro ao carregar: ' + err.message; console.error(err); });
})();
